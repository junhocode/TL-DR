<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        const saved = localStorage.getItem("dark");
        const isDark = saved === null ? matchMedia("(prefers-color-scheme: dark)").matches : saved === "true";
        if (isDark) document.documentElement.classList.add("dark");
      } catch {}
    </script>
    <link rel="preload" href="/src/assets/fonts/anton-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <title>ryuji - TL;DR</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
